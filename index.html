<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>おすすめ靴診断</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #2a241d;
      --ink-soft: #6b6258;
      --ivory: #f6f2ea;
      --paper: #fffdf9;
      --brass: #a0814a;
      --brass-soft: #d7c9ab;
      --hairline: #e7e0d2;
      --serif: 'Shippori Mincho', 'Hiragino Mincho ProN', serif;
      --sans: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--sans);
      background: var(--ivory);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      background: var(--paper);
      max-width: 460px;
      width: 100%;
      padding: 2.5rem 1.75rem 2.25rem;
      border: 1px solid var(--hairline);
      border-top: 3px solid var(--brass);
      box-shadow: 0 18px 50px -24px rgba(42,36,29,0.25);
    }
    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.34em;
      color: var(--brass);
      margin-bottom: 1rem;
      font-weight: 600;
    }
    .title {
      font-family: var(--serif);
      font-size: 25px;
      font-weight: 600;
      line-height: 1.55;
      letter-spacing: 0.04em;
      margin-bottom: 0.75rem;
    }
    .subtitle {
      font-size: 13.5px;
      color: var(--ink-soft);
      line-height: 1.9;
      margin-bottom: 2.25rem;
    }
    /* ハトメ式プログレス */
    .lace-progress {
      display: flex;
      align-items: center;
      margin-bottom: 0.6rem;
    }
    .eyelet {
      width: 13px; height: 13px;
      border-radius: 50%;
      border: 2.5px solid var(--brass-soft);
      background: var(--paper);
      flex: none;
      transition: border-color 0.45s ease, background-color 0.45s ease, transform 0.45s ease;
    }
    .eyelet.done { border-color: var(--brass); background: var(--brass); transform: scale(1.05); }
    .eyelet.now { border-color: var(--brass); }
    .lace {
      flex: 1; height: 1px;
      background: var(--brass-soft);
      margin: 0 4px;
      position: relative; overflow: hidden;
    }
    .lace::after {
      content: "";
      position: absolute; inset: 0;
      background: var(--brass);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.5s cubic-bezier(0.4,0,0.2,1);
    }
    .lace.done::after { transform: scaleX(1); }
    .step-label {
      font-size: 11px;
      letter-spacing: 0.18em;
      color: var(--ink-soft);
      text-align: right;
      margin-bottom: 2rem;
    }
    /* 質問アニメーション */
    .question-wrap { min-height: 200px; }
    .question-inner { opacity: 1; transform: translateY(0); transition: opacity 0.3s ease, transform 0.3s ease; }
    .question-inner.exit { opacity: 0; transform: translateY(-14px); }
    .question-inner.enter { opacity: 0; transform: translateY(18px); }
    .question-inner.enter-active { opacity: 1; transform: translateY(0); transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.2,0.8,0.3,1); }
    .q-no {
      font-family: var(--serif);
      font-size: 12px;
      letter-spacing: 0.22em;
      color: var(--brass);
      margin-bottom: 0.6rem;
    }
    .question {
      font-family: var(--serif);
      font-size: 18.5px;
      font-weight: 600;
      line-height: 1.85;
      letter-spacing: 0.02em;
      margin-bottom: 1.5rem;
    }
    .q-hint {
      font-size: 12px;
      color: var(--ink-soft);
      margin-bottom: 1.25rem;
      line-height: 1.7;
    }
    /* 選択肢ボタン（複数選択） */
    .choice-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1.5rem; }
    .choice-btn {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--hairline);
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 14px;
      letter-spacing: 0.04em;
      cursor: pointer;
      text-align: left;
      transition: border-color 0.18s ease, background 0.18s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .choice-btn .check-mark {
      width: 18px; height: 18px;
      border: 1.5px solid var(--brass-soft);
      border-radius: 3px;
      flex: none;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.18s, background 0.18s;
    }
    .choice-btn.selected { border-color: var(--brass); background: #fdf9f3; }
    .choice-btn.selected .check-mark {
      border-color: var(--brass);
      background: var(--brass);
    }
    .choice-btn.selected .check-mark::after {
      content: "";
      width: 10px; height: 6px;
      border-left: 2px solid #fff;
      border-bottom: 2px solid #fff;
      transform: rotate(-45deg) translateY(-1px);
    }
    .choice-btn.exclusive { border-color: var(--hairline); }
    .next-btn {
      width: 100%;
      padding: 15px 10px;
      border: 1px solid var(--ink);
      background: transparent;
      color: var(--ink);
      font-family: var(--sans);
      font-size: 14.5px;
      font-weight: 600;
      letter-spacing: 0.14em;
      cursor: pointer;
      transition: background 0.18s ease, color 0.18s ease;
      opacity: 0.4;
      pointer-events: none;
    }
    .next-btn.active { opacity: 1; pointer-events: auto; }
    .next-btn.active:hover { background: var(--ink); color: var(--ivory); }
    /* はい/いいえボタン */
    .btn-row { display: flex; gap: 12px; }
    .yn-btn {
      flex: 1;
      padding: 15px 10px;
      border: 1px solid #cfc8bb;
      background: transparent;
      color: var(--ink);
      font-family: var(--sans);
      font-size: 14.5px;
      font-weight: 600;
      letter-spacing: 0.14em;
      cursor: pointer;
      transition: background 0.18s ease, color 0.18s ease, transform 0.12s ease;
    }
        .yn-btn:active { transform: scale(0.97); }
    /* 結果画面 */
    .result-screen { display: none; }
    .result-screen.visible { display: block; animation: fadeIn 0.6s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .result-label {
      font-size: 11px;
      letter-spacing: 0.34em;
      color: var(--brass);
      margin-bottom: 0.6rem;
      font-weight: 600;
    }
    .result-title {
      font-family: var(--serif);
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.04em;
      margin-bottom: 1.75rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--hairline);
    }
    .section-label {
      font-size: 11px;
      letter-spacing: 0.28em;
      color: var(--brass);
      font-weight: 600;
      margin-bottom: 1rem;
    }
    .shoe-card {
      background: #fff;
      border: 1px solid var(--hairline);
      margin-bottom: 1rem;
      opacity: 0;
      transform: translateY(10px);
      animation: cardIn 0.5s ease forwards;
    }
    .shoe-card:nth-child(1) { animation-delay: 0.1s; }
    .shoe-card:nth-child(2) { animation-delay: 0.25s; }
    .shoe-card:nth-child(3) { animation-delay: 0.4s; }
    .shoe-card:nth-child(4) { animation-delay: 0.55s; }
    @keyframes cardIn { to { opacity: 1; transform: translateY(0); } }
    .shoe-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px 8px;
      border-left: 3px solid var(--brass);
    }
    .badge-text {
      font-size: 11px;
      letter-spacing: 0.22em;
      color: var(--brass);
      font-weight: 600;
    }
    .shoe-img {
      width: 100%;
      display: block;
      background: #fff;
    }
    .shoe-info { padding: 14px 16px 16px; }
    .shoe-brand {
      font-size: 10.5px;
      letter-spacing: 0.28em;
      color: var(--brass);
      margin-bottom: 3px;
    }
    .shoe-name {
      font-family: var(--serif);
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.04em;
      margin-bottom: 8px;
    }
    .shoe-desc {
      font-size: 13px;
      color: var(--ink-soft);
      line-height: 1.85;
    }
    .divider { height: 1px; background: var(--hairline); margin: 1.5rem 0; }
    /* 注意書き */
    .notice {
      border-left: 2px solid var(--brass-soft);
      padding: 0 0 0 12px;
      font-size: 12px;
      color: var(--ink-soft);
      line-height: 1.9;
      margin-bottom: 1.5rem;
    }
    /* LINE CTA */
    .cta-box {
      background: var(--ivory);
      border: 1px solid var(--brass-soft);
      padding: 1.25rem 1.25rem 1.1rem;
      text-align: center;
    }
    .cta-text {
      font-size: 13px;
      color: var(--ink-soft);
      line-height: 1.85;
      margin-bottom: 1rem;
    }
    .line-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #06C755;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.08em;
      padding: 13px 28px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: opacity 0.18s;
      width: 100%;
    }
    .line-btn:hover { opacity: 0.88; }
    .line-icon {
      width: 20px; height: 20px;
      background: #fff;
      border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      flex: none;
    }
    .line-icon svg { width: 14px; height: 14px; }
    .retry-btn {
      width: 100%;
      margin-top: 1rem;
      padding: 13px;
      border: 1px solid var(--hairline);
      background: transparent;
      color: var(--ink-soft);
      font-size: 13px;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: border-color 0.18s, color 0.18s;
    }
    .retry-btn:hover { border-color: var(--ink); color: var(--ink); }
  </style>
</head>

<div class="card" id="app">

  <!-- ===== TOP / QUIZ ===== -->
  <div id="quiz-screen">
    <p class="eyebrow">FITTING CARTE</p>
    <h1 class="title">おすすめ靴診断</h1>
    <p class="subtitle">質問に答えて、あなたにぴったりの一足を。</p>

    <!-- ハトメプログレス -->
    <div class="lace-progress" id="lace-progress">
      <div class="eyelet now" id="e0"></div><div class="lace" id="l0"></div>

    <p class="step-label" id="step-label">第一問 / 四問</p>

    <div class="question-wrap">

        <p class="q-no" id="q-no">第一問</p>
        <p class="question" id="question-text"></p>
        <p class="q-hint" id="q-hint" style="display:none"></p>
        <div id="answer-area"></div>
      </div>
    </div>
  </div>

  <!-- ===== RESULT ===== -->
  <div id="result-screen" class="result-screen">
    <p class="result-label">FITTING RESULT</p>
    <h2 class="result-title">あなたへのおすすめ</h2>
    <div id="result-content"></div>
    <div class="divider"></div>
    <div class="notice">メーカーやブランドによって同じサイズ表記でも履き心地が大きく異なります。ご購入の際は必ず店頭で足を通し、実際にフィット感を確認してください。<br><br>重度の外反母趾がある方は、現在お使いの靴で当たりが出ていない場合、その靴を継続されることをおすすめします。</div>
    <div class="cta-box">
      <p class="cta-text">当サロンでは初回来店時に足の計測・靴のご提案を無料で行っています。お気軽にご相談ください。</p>
      <a href="https://lin.ee/pcq06GW" target="_blank" class="line-btn">
        LINEで相談する
      </a>
    </div>
    <button class="retry-btn" onclick="restart()">もう一度診断する</button>
  </div>

</div>

const QUESTIONS = [
  { no: '第一問', text: '足の裏に痛みを感じることはありますか？', key: 'pain' },
  { no: '第二問', text: '外反母趾はありますか？', key: 'bunion' },
  { no: '第三問', text: '靴を履くと小指の外側が当たって痛くなりますか？', key: 'pinky' },
  { no: '第四問', text: '靴をよく脱いだり履いたりしますか？', key: 'remove' }
];
const NUM = ['一','二','三','四'];
let step = 0;
let answers = {};

function updateProgress(step) {
  for (let i = 0; i < 4; i++) {
    const e = document.getElementById('e' + i);
    e.classList.remove('done', 'now');
    if (i < step) e.classList.add('done');
    else if (i === step) e.classList.add('now');
  }
  for (let i = 0; i < 3; i++) {
    document.getElementById('l' + i).classList.toggle('done', i < step);
  }
  document.getElementById('step-label').textContent = '第' + NUM[step] + '問 / 四問';
}

function render() {
  const q = QUESTIONS[step];
  document.getElementById('q-no').textContent = q.no;
  document.getElementById('question-text').textContent = q.text;
  document.getElementById('answer-area').innerHTML = `
    <div class="btn-row">
      <button class="yn-btn" onclick="answer(true)">はい</button>
      <button class="yn-btn" onclick="answer(false)">いいえ</button>
    </div>
  `;
}

function answer(val) {
  answers[QUESTIONS[step].key] = val;
  if (step < QUESTIONS.length - 1) goToStep(step + 1);
  else showResult();
}

function goToStep(nextStep) {
  const inner = document.getElementById('question-inner');
  inner.classList.add('exit');
  setTimeout(() => {
    step = nextStep;
    updateProgress(step);
    inner.classList.remove('exit');
    inner.classList.add('enter');
    render();
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        inner.classList.remove('enter');
        inner.classList.add('enter-active');
        setTimeout(() => inner.classList.remove('enter-active'), 400);
      });
    });
  }, 300);
}

function showResult() {
  // 診断ロジック
  const hasTrouble = !!(answers.pain || answers.bunion || answers.pinky);
  const removesOften = !!answers.remove;

  let featured = null; // 特におすすめ
  let others = [];     // その他おすすめ

  if (hasTrouble) {
    // 足トラブルあり → NB特におすすめ、アシックス除外
    featured = 'nb';
    others = ['nike', 'stan'].filter(s => !(removesOften && s === 'stan'));
  } else if (removesOften) {
    // 着脱多い・トラブルなし → スタンスミス除外
    others = ['nb', 'asics', 'nike'];
  } else {
    // 全て問題なし
    others = ['nb', 'asics', 'nike', 'stan'];
  }

  // 結果HTML生成
  let html = '';

  if (featured) {
    html += `<p class="section-label">特におすすめ</p>`;
    html += shoeCardHTML(featured, true);
    if (others.length > 0) {
      html += `<div class="divider"></div><p class="section-label">あわせておすすめ</p>`;
      others.forEach(id => { html += shoeCardHTML(id, false); });
    }
  } else {
    html += `<p class="section-label">おすすめ</p>`;
    others.forEach(id => { html += shoeCardHTML(id, false); });
  }

  document.getElementById('result-content').innerHTML = html;

  // 画面切り替え
  document.getElementById('quiz-screen').style.display = 'none';
  const rs = document.getElementById('result-screen');
  rs.classList.add('visible');
  rs.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function shoeCardHTML(id, isFeatured) {
  const s = SHOES[id];
  return `
    <div class="shoe-card">
      ${isFeatured ? `<div class="shoe-badge"><span class="badge-text">特におすすめ</span></div>` : ''}
      <img src="${s.img}" alt="${s.name}" class="shoe-img">
      <div class="shoe-info">
        <p class="shoe-brand">${s.brand}</p>
        <p class="shoe-name">${s.name}</p>
        <p class="shoe-desc">${s.desc}</p>
      </div>
    </div>
  `;
}

function restart() {
  answers = {};
  step = 0;
  document.getElementById('result-screen').classList.remove('visible');
  document.getElementById('quiz-screen').style.display = 'block';
  updateProgress(0);
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// 初期化
updateProgress(0);
render();
</script>
